# Стек для VPS: приложение + Postgres + Caddy (HTTPS).
# Запуск: docker compose -f docker-compose.vps.yml up -d --build
# Нужны .env (боевые секреты, SMTP заказчика) и DOMAIN.
#
# Образ можно собрать на сервере или загрузить заранее:
#   docker build -t khan-him:latest .
#   docker compose -f docker-compose.vps.yml up -d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: khan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khan}
      POSTGRES_DB: khan_him
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U khan -d khan_him']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: khan-him:latest
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://khan:${POSTGRES_PASSWORD:-khan}@postgres:5432/khan_him
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://${DOMAIN}}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
