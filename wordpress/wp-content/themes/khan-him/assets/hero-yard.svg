<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A3A5C"/>
      <stop offset="48%" stop-color="#0F2438"/>
      <stop offset="100%" stop-color="#0A1624"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A93A8"/>
      <stop offset="100%" stop-color="#3D5366"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2B4A66"/>
      <stop offset="45%" stop-color="#4F7190"/>
      <stop offset="100%" stop-color="#243E55"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152536"/>
      <stop offset="100%" stop-color="#0B1520"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g opacity="0.18" stroke="#9BB4C9" stroke-width="1">
    <path d="M0 180 H1600 M0 260 H1600 M0 340 H1600"/>
    <path d="M220 0 V420 M420 0 V420 M620 0 V420 M820 0 V420 M1020 0 V420 M1220 0 V420 M1420 0 V420"/>
  </g>
  <!-- distant tanks -->
  <g opacity="0.55">
    <ellipse cx="1180" cy="430" rx="70" ry="18" fill="#2E4A63"/>
    <rect x="1110" y="250" width="140" height="180" fill="url(#steel)"/>
    <ellipse cx="1180" cy="250" rx="70" ry="18" fill="#8AA3B8"/>
    <ellipse cx="1340" cy="450" rx="55" ry="14" fill="#2E4A63"/>
    <rect x="1285" y="300" width="110" height="150" fill="#3A556C"/>
    <ellipse cx="1340" cy="300" rx="55" ry="14" fill="#7E98AD"/>
  </g>
  <!-- pipe run -->
  <path d="M0 520 H640 Q680 520 680 480 V360" stroke="#5C7A93" stroke-width="18" stroke-linecap="square"/>
  <path d="M0 520 H640 Q680 520 680 480 V360" stroke="#8BA6BC" stroke-width="4" opacity="0.5"/>
  <circle cx="680" cy="360" r="16" fill="#6D8BA4"/>
  <!-- foreground drums -->
  <g>
    <ellipse cx="260" cy="720" rx="95" ry="28" fill="#1A2E40"/>
    <rect x="165" y="520" width="190" height="200" fill="url(#drum)"/>
    <ellipse cx="260" cy="520" rx="95" ry="28" fill="#6F8FA8"/>
    <path d="M175 580 H345 M175 640 H345" stroke="#9BB6CB" stroke-width="3" opacity="0.45"/>
  </g>
  <g>
    <ellipse cx="470" cy="740" rx="85" ry="24" fill="#1A2E40"/>
    <rect x="385" y="560" width="170" height="180" fill="#355670"/>
    <ellipse cx="470" cy="560" rx="85" ry="24" fill="#6A879E"/>
    <path d="M395 610 H545 M395 670 H545" stroke="#9BB6CB" stroke-width="3" opacity="0.35"/>
  </g>
  <g>
    <ellipse cx="680" cy="760" rx="75" ry="20" fill="#1A2E40"/>
    <rect x="605" y="600" width="150" height="160" fill="#2F4C64"/>
    <ellipse cx="680" cy="600" rx="75" ry="20" fill="#5F7D94"/>
  </g>
  <!-- loading bay silhouette -->
  <path d="M900 760 V420 H1580 V760 Z" fill="#132433" opacity="0.85"/>
  <path d="M940 760 V480 H1200 V760 Z" fill="#1A3348"/>
  <path d="M1240 760 V500 H1540 V760 Z" fill="#1A3348"/>
  <rect x="900" y="400" width="680" height="28" fill="#4E6C84"/>
  <!-- ground -->
  <rect y="720" width="1600" height="180" fill="url(#ground)"/>
  <path d="M0 720 H1600" stroke="#3D5A72" stroke-width="2" opacity="0.5"/>
  <g opacity="0.25" stroke="#6E8BA3" stroke-width="1">
    <path d="M0 780 H900 M0 830 H900"/>
  </g>
</svg>
